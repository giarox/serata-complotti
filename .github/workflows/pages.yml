name: Pubblica su GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public by design: the publishable key only allows what setup.sql grants to signed-in guests.
      VITE_SUPABASE_URL: https://jjftlmjaxzbyadpwtnrf.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_krLefCQTesVIjEN6JI_xNA_p5DRUiua
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/domain.test.ts tests/awards.test.ts tests/dossier.test.ts
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
